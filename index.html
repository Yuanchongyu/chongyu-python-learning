  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23172116'/%3E%3Cpath d='M10 14h44v18H10z' fill='%235fc65b'/%3E%3Cpath d='M10 32h44v22H10z' fill='%23845a36'/%3E%3Cpath d='M20 22h8v8h-8zm20-4h8v8h-8z' fill='%23317e3f'/%3E%3C/svg%3E" />
  <style>
    :root{--ink:#f7f8ed;--muted:#aab3a5;--panel:#1b231c;--panel2:#121813;--line:#354236;--grass:#67c34f;--gold:#ffd65a;--red:#ff725c;--blue:#75bfff;--code:#0d120e}
    *{box-sizing:border-box} body{margin:0;background:#0e130f;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;min-height:100vh;overflow-x:hidden}
    button,textarea{font:inherit} button{color:inherit}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:18px;background:#111712;position:sticky;top:0;z-index:5}
    .brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:-.02em}.cube{width:34px;height:34px;background:linear-gradient(#69ce55 0 37%,#8b623a 37%);border:3px solid #0b100c;box-shadow:inset -5px -5px 0 #0002;border-radius:6px;transform:rotate(-3deg)}
    .brand small{display:block;color:var(--muted);font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}.progress-wrap{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:220px}.progress{height:8px;background:#283228;border-radius:99px;flex:1;overflow:hidden}.progress>i{display:block;height:100%;width:16.6%;background:var(--grass);transition:.35s}.level-count{color:var(--muted);font-size:13px}
    main{height:calc(100vh - 68px);display:grid;grid-template-columns:minmax(330px,38%) minmax(500px,62%)}.game-side{padding:22px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:radial-gradient(circle at 20% 5%,#233828 0,transparent 40%)}
    .lesson-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}.lesson-num{display:grid;place-items:center;width:43px;height:43px;flex:none;border:2px solid #78d265;background:#1e3421;border-radius:9px;color:#a5f28e;font-weight:900}.eyebrow{color:#8cce7c;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.lesson-head h1{font-size:25px;line-height:1.1;margin:4px 0 0;letter-spacing:-.03em}.mission{margin:0 0 16px;color:#cad1c6;font-size:15px;line-height:1.55}.mission code,.hint code{background:#263329;color:#bff2ad;padding:2px 6px;border-radius:4px}
    .world-frame{position:relative;min-height:300px;flex:1;border:2px solid #3d4b3e;border-radius:14px;overflow:hidden;background:#77aee6;box-shadow:0 20px 50px #0006}.world{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(7,1fr);perspective:700px}.tile{position:relative;border:1px solid #0002;background:#62b94d;box-shadow:inset 0 -7px #0001}.tile:nth-child(3n){background:#68c552}.tile.wall{background:#69736d;box-shadow:inset 0 -10px #404943}.tile.water{background:#369ed0;box-shadow:inset 0 -8px #197baa}.tile.goal{background:#debe45;box-shadow:inset 0 -8px #9f7d20}.tile.lava{background:#ef6a32;box-shadow:inset 0 -8px #a9361e}.tile.tree::after{content:"🌳";font-size:34px;position:absolute;inset:-5px 0 0;display:grid;place-items:center;filter:drop-shadow(4px 5px 0 #0003)}
    .player,.gem{position:absolute;width:12.5%;height:14.285%;display:grid;place-items:center;z-index:3;transition:left .25s ease,top .25s ease,transform .25s ease}.player{font-size:34px;filter:drop-shadow(4px 5px 0 #0005)}.gem{font-size:30px;animation:bob 1.2s infinite ease-in-out}.gem.hidden{opacity:0;transform:scale(.2)}@keyframes bob{50%{margin-top:-7px}}
    .world-label{position:absolute;bottom:12px;left:12px;background:#0d130dcc;border:1px solid #ffffff22;padding:7px 10px;border-radius:7px;font-size:12px;color:#d8e5d4;z-index:4;backdrop-filter:blur(8px)}
    .tip{margin-top:14px;display:flex;gap:10px;align-items:flex-start;color:#abb6a8;font-size:13px}.tip b{color:var(--gold)}
    .code-side{display:grid;grid-template-rows:auto 1fr auto;min-height:0;background:var(--panel2)}.toolbar{padding:17px 20px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.file-tab{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px;color:#cde2c6}.dot{width:8px;height:8px;background:var(--grass);border-radius:50%;box-shadow:0 0 12px #68dc67}.toolbar .spacer{flex:1}.ghost,.run,.next{border:0;border-radius:8px;padding:10px 15px;font-weight:800;cursor:pointer;transition:.18s}.ghost{background:#242e25;border:1px solid #3b493c;color:#d3d9d0}.run{background:var(--grass);color:#102010;box-shadow:0 5px 0 #347b2d}.run:hover{transform:translateY(-1px)}.run:active{transform:translateY(3px);box-shadow:0 2px 0 #347b2d}.run:disabled{opacity:.55;cursor:wait}.editor-wrap{min-height:0;position:relative;background:var(--code)}.editor-wrap::before{content:"1\A 2\A 3\A 4\A 5\A 6\A 7\A 8\A 9\A10\A11\A12\A13\A14\A15";white-space:pre;position:absolute;left:0;top:0;width:45px;height:100%;padding:22px 9px;color:#556057;text-align:right;line-height:1.65;font:15px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;background:#101611;border-right:1px solid #263027;pointer-events:none}.editor{display:block;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:#e8f2e5;padding:22px 22px 22px 62px;line-height:1.65;font:15px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4;caret-color:var(--grass)}
    .console{border-top:1px solid var(--line);min-height:152px;max-height:220px;background:#141b15}.console-head{padding:10px 18px;border-bottom:1px solid #29332a;display:flex;align-items:center;color:#aab4a7;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.console-head span{margin-left:auto;text-transform:none;font-weight:500;letter-spacing:0;color:#768176}.output{margin:0;padding:14px 18px 18px;white-space:pre-wrap;overflow:auto;max-height:160px;color:#bdc8ba;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.output.ok{color:#a9eb93}.output.err{color:#ff9585}.next{display:none;margin:0 18px 16px;background:var(--gold);color:#2c2406}.next.show{display:block}
    .loading{position:fixed;inset:68px 0 0;background:#0e130ff2;z-index:9;display:grid;place-items:center;text-align:center}.loading.hidden{display:none}.loader-cube{font-size:54px;animation:spin 1.3s infinite steps(4)}@keyframes spin{to{transform:rotate(360deg)}}.loading p{color:#b7c2b4}.loading strong{display:block;font-size:20px;margin-top:14px;color:#fff}
    @media(max-width:860px){body{overflow:auto}.topbar{padding:0 14px}.brand small{display:none}.progress-wrap{min-width:140px}.level-count{display:none}main{height:auto;grid-template-columns:1fr}.game-side{border-right:0;border-bottom:1px solid var(--line);min-height:620px}.code-side{min-height:650px}.world-frame{min-height:330px}.toolbar{position:sticky;top:68px;z-index:4;background:#121813}.editor-wrap{min-height:390px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="cube" aria-hidden="true"></div>
    <div class="brand">Python Craft Lab<small>Chongyu 老师的代码世界</small></div>
    <div class="progress-wrap"><div class="progress"><i id="progressFill"></i></div><span class="level-count" id="levelCount">1 / 6</span></div>
  </header>
  <main>
    <section class="game-side">
      <div class="lesson-head"><div class="lesson-num" id="lessonNum">01</div><div><div class="eyebrow" id="concept">第一步 · 函数调用</div><h1 id="title">走到钻石旁边</h1></div></div>
      <p class="mission" id="mission"></p>
      <div class="world-frame">
        <div class="world" id="world"></div><div class="gem" id="gem">💎</div><div class="player" id="player">🧑🏻‍🌾</div>
        <div class="world-label" id="worldLabel">目标：收集钻石</div>
      </div>
      <div class="tip"><b>提示</b><span class="hint" id="hint"></span></div>
    </section>
    <section class="code-side">
      <div class="toolbar"><span class="dot"></span><span class="file-tab">adventure.py</span><span class="spacer"></span><button class="ghost" id="resetBtn">↻ 重置</button><button class="run" id="runBtn">▶ 运行代码</button></div>
      <div class="editor-wrap"><textarea class="editor" id="editor" spellcheck="false" aria-label="Python 代码编辑器"></textarea></div>
      <div class="console"><div class="console-head">终端 <span id="engineStatus">正在准备 Python…</span></div><pre class="output" id="output">载入真正的 Python 运行环境后，就可以开始冒险。</pre><button class="next" id="nextBtn">下一关 →</button></div>
    </section>
  </main>
  <div class="loading" id="loading"><div><div class="loader-cube">⛏️</div><strong>正在生成方块世界</strong><p>第一次载入 Python 需要几秒钟</p></div></div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script>
    const levels=[
      {concept:'第一步 · 函数调用',title:'走到钻石旁边',mission:'Steve 离钻石还有 3 格。每调用一次 <code>move_forward()</code>，他就会向前走一格。',hint:'试着写 3 行 <code>move_forward()</code>。',start:[1,5],dir:0,goal:[4,5],code:'# 让 Steve 向前走三格\nmove_forward()\n',check:s=>s.x===4&&s.y===5},
      {concept:'第二步 · for 循环',title:'穿过长长的草地',mission:'这次钻石在 5 格之外。不要重复写 5 行，用 <code>for</code> 循环让代码更聪明。',hint:'格式是 <code>for i in range(5):</code>，下一行记得缩进。',start:[1,3],dir:0,goal:[6,3],code:'# 用循环前进 5 次\nfor i in range(5):\n    move_forward()\n',check:s=>s.x===6&&s.y===3},
      {concept:'第三步 · 变量',title:'使用能量水晶',mission:'先创建变量 <code>steps = 4</code>，再把它交给 <code>range(steps)</code>，走到目标处。',hint:'变量就像一个有名字的箱子，可以保存数字。',start:[2,5],dir:3,goal:[2,1],code:'# 把数字保存在变量里\nsteps = 4\n\nfor i in range(steps):\n    move_forward()\n',check:s=>s.x===2&&s.y===1},
      {concept:'第四步 · 转弯',title:'绕过石墙',mission:'前方是石墙。使用 <code>turn_left()</code> 和 <code>turn_right()</code> 改变方向，绕到钻石处。',hint:'路线：向上 2 格，右转，向右 3 格。',start:[2,5],dir:3,goal:[5,3],walls:[[3,5],[4,5],[5,5]],code:'# 绕过石墙\nfor i in range(2):\n    move_forward()\n\nturn_right()\n',check:s=>s.x===5&&s.y===3},
      {concept:'第五步 · if 判断',title:'小心前方的岩浆',mission:'用 <code>block_ahead()</code> 查看前方。如果返回 <code>"lava"</code>，就向左转；然后走 3 格。',hint:'判断写法：<code>if block_ahead() == "lava":</code>',start:[3,5],dir:3,goal:[0,5],lava:[[3,4]],code:'# 检查前方是什么\nif block_ahead() == "lava":\n    turn_left()\n\n# 再走 3 格\n',check:s=>s.x===0&&s.y===5},
      {concept:'最终挑战 · 自定义函数',title:'建造你的第一座塔',mission:'完成函数 <code>build_tower()</code>：放置 3 个方块。调用它后，新的瞭望塔就会建成。',hint:'在函数中使用循环调用 <code>place_block()</code> 3 次。',start:[3,4],dir:0,goal:null,code:'def build_tower():\n    # 在这里写循环\n    pass\n\nbuild_tower()\n',check:s=>s.blocks>=3,build:true}
    ];
    let current=Number(localStorage.getItem('craft-level')||0); if(current>=levels.length) current=0;
    let pyReady=false,worker,runTimer,baseState;
    const $=id=>document.getElementById(id), editor=$('editor'),output=$('output'),player=$('player'),gem=$('gem');
    function renderLevel(){const l=levels[current];$('lessonNum').textContent=String(current+1).padStart(2,'0');$('concept').textContent=l.concept;$('title').textContent=l.title;$('mission').innerHTML=l.mission;$('hint').innerHTML=l.hint;$('levelCount').textContent=`${current+1} / ${levels.length}`;$('progressFill').style.width=`${(current+1)/levels.length*100}%`;editor.value=l.code;$('nextBtn').className='next';output.className='output';output.textContent='准备好了。修改代码，然后点击“运行代码”。';$('worldLabel').textContent=l.build?'目标：放置 3 个方块':'目标：收集钻石';drawWorld(l);resetPlayer();}
    function drawWorld(l){const w=$('world');w.innerHTML='';for(let y=0;y<7;y++)for(let x=0;x<8;x++){const d=document.createElement('div');d.className='tile';if((l.walls||[]).some(p=>p[0]===x&&p[1]===y))d.classList.add('wall');if((l.lava||[]).some(p=>p[0]===x&&p[1]===y))d.classList.add('lava');if(l.goal&&l.goal[0]===x&&l.goal[1]===y)d.classList.add('goal');if(((x*7+y*11)%19===0)&&!(l.goal&&l.goal[0]===x&&l.goal[1]===y))d.classList.add('tree');w.appendChild(d)}gem.style.display=l.goal?'grid':'none';if(l.goal)pos(gem,l.goal[0],l.goal[1]);}
    function pos(el,x,y){el.style.left=(x*12.5)+'%';el.style.top=(y*14.285)+'%'}
    function resetPlayer(){const l=levels[current];baseState={x:l.start[0],y:l.start[1],dir:l.dir,blocks:0};pos(player,baseState.x,baseState.y);player.style.transform=`rotate(${baseState.dir*90}deg)`;gem.classList.remove('hidden');document.querySelectorAll('.placed').forEach(e=>e.remove())}
    function makeWorker(){const src=`importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');let py;onmessage=async(e)=>{if(e.data.type==='init'){try{py=await loadPyodide();postMessage({type:'ready'})}catch(error){postMessage({type:'fatal',error:String(error)})}}else if(e.data.type==='run'){let s={...e.data.state},actions=[],walls=e.data.walls||[],lava=e.data.lava||[];const blocked=(x,y)=>x<0||x>7||y<0||y>6||walls.some(p=>p[0]===x&&p[1]===y);const next=()=>{let ds=[[1,0],[0,1],[-1,0],[0,-1]][s.dir];return[s.x+ds[0],s.y+ds[1]]};py.globals.set('move_forward',()=>{let n=next();if(blocked(...n))throw Error('前面有障碍物，Steve 走不过去！');s.x=n[0];s.y=n[1];actions.push(['move',s.x,s.y])});py.globals.set('turn_left',()=>{s.dir=(s.dir+3)%4;actions.push(['turn',s.dir])});py.globals.set('turn_right',()=>{s.dir=(s.dir+1)%4;actions.push(['turn',s.dir])});py.globals.set('place_block',()=>{s.blocks++;actions.push(['block',s.x,s.y,s.blocks])});py.globals.set('block_ahead',()=>{let n=next();return lava.some(p=>p[0]===n[0]&&p[1]===n[1])?'lava':walls.some(p=>p[0]===n[0]&&p[1]===n[1])?'stone':'grass'});let logs=[];py.setStdout({batched:s=>logs.push(s)});try{await py.runPythonAsync(e.data.code);postMessage({type:'result',state:s,actions,logs})}catch(error){postMessage({type:'error',error:String(error).replace('PythonError: ','')})}}};`;worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));worker.onmessage=handleWorker;worker.postMessage({type:'init'});}
    function handleWorker(e){const m=e.data;if(m.type==='ready'){pyReady=true;$('engineStatus').textContent='Python 3 · 已就绪';$('loading').classList.add('hidden')}else if(m.type==='fatal'){$('loading').classList.add('hidden');output.className='output err';output.textContent='Python 加载失败，请刷新页面重试。'}else if(m.type==='error'){finishRun();output.className='output err';output.textContent='代码遇到了问题：\n'+friendlyError(m.error)}else if(m.type==='result'){clearTimeout(runTimer);animateActions(m.actions,()=>judge(m.state,m.logs))}}
    function friendlyError(s){if(s.includes('IndentationError'))return '缩进不正确。请检查 for、if 或 def 后面的代码是否向右缩进了 4 个空格。';if(s.includes('SyntaxError'))return '语法有一点问题。检查冒号、括号和引号是否完整。\n\n'+s.split('\n').slice(-3).join('\n');if(s.includes('NameError'))return '有一个名字 Python 不认识。检查拼写和变量名。\n\n'+s.split('\n').slice(-1)[0];return s.split('\n').slice(-5).join('\n')}
    function animateActions(actions,done){let i=0,state={...baseState};const tick=()=>{if(i>=actions.length){done();return}const a=actions[i++];if(a[0]==='move'){state.x=a[1];state.y=a[2];pos(player,state.x,state.y)}if(a[0]==='turn'){state.dir=a[1];player.style.transform=`rotate(${state.dir*90}deg)`}if(a[0]==='block'){const b=document.createElement('div');b.className='gem placed';b.textContent='🧱';b.style.left=(45+a[3]*3)+'%';b.style.top=(45-a[3]*9)+'%';$('world').parentElement.appendChild(b)}setTimeout(tick,280)};tick()}
    function judge(state,logs){finishRun();const ok=levels[current].check(state);output.className='output '+(ok?'ok':'');if(ok){gem.classList.add('hidden');output.textContent=(logs.length?logs.join('\n')+'\n':'')+'✅ 任务完成！你的 Python 代码改变了这个世界。';$('nextBtn').textContent=current===levels.length-1?'重新开始冒险 ↻':'下一关 →';$('nextBtn').className='next show';localStorage.setItem('craft-level',String(Math.min(current+1,levels.length-1)))}else{output.textContent=(logs.length?logs.join('\n')+'\n':'')+'还没有到达目标。看看提示，再试一次！'} }
    function finishRun(){clearTimeout(runTimer);$('runBtn').disabled=false;$('runBtn').textContent='▶ 运行代码'}
    function run(){if(!pyReady)return;resetPlayer();output.className='output';output.textContent='正在运行…';$('runBtn').disabled=true;$('runBtn').textContent='运行中…';worker.postMessage({type:'run',code:editor.value,state:baseState,walls:levels[current].walls||[],lava:levels[current].lava||[]});runTimer=setTimeout(()=>{worker.terminate();makeWorker();finishRun();output.className='output err';output.textContent='代码运行太久，已停止。检查是否写了不会结束的循环。'},6000)}
    editor.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const s=editor.selectionStart;editor.value=editor.value.slice(0,s)+'    '+editor.value.slice(editor.selectionEnd);editor.selectionStart=editor.selectionEnd=s+4}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}});
    $('runBtn').onclick=run;$('resetBtn').onclick=()=>{resetPlayer();editor.value=levels[current].code;output.className='output';output.textContent='代码已重置。'};$('nextBtn').onclick=()=>{current=current===levels.length-1?0:current+1;localStorage.setItem('craft-level',String(current));renderLevel()};
    renderLevel();makeWorker();
  </script>
  <style>
    .world-frame{background:radial-gradient(circle at 50% 8%,#d9f4ff 0,#8fc8de 48%,#5d91aa 100%);border:0;padding:7px;border-radius:22px;box-shadow:inset 0 1px #ffffff55,0 24px 60px #02070366}
    .world-frame:before{content:"";position:absolute;inset:7px;border-radius:16px;box-shadow:inset 0 0 0 1px #ffffff30;pointer-events:none;z-index:5}
    .world{display:none}.world-frame canvas{display:block;width:100%;height:100%;border-radius:16px;cursor:grab}.world-frame canvas:active{cursor:grabbing}.world-label{top:18px;bottom:auto;left:18px;border:0;background:#07100bc4;box-shadow:inset 0 0 0 1px #ffffff24}.world-label:after{content:" · 拖动画面旋转";color:#91a698}
    .player,.gem{display:none!important}.editor-wrap:before{display:none}.editor{visibility:hidden}.editor-wrap{padding:7px;background:#ffffff05}.monaco-shell{position:absolute;inset:7px 7px 0;border-radius:14px 14px 0 0;overflow:hidden;box-shadow:inset 0 1px #ffffff0e}.monaco-editor .overflow-guard{border-radius:14px 14px 0 0}.toolbar{min-height:62px}.ghost,.run{border-radius:11px}.run{box-shadow:0 7px 22px #5dbb4230,inset 0 1px #efffe088}.game-side{background:radial-gradient(circle at 12% 2%,#203a26 0,transparent 42%)}
  </style>
  <script>
    (()=>{
      let s3,c3,r3,group3,hero3,gem3,blocks3=[],drag3=false,last3=0,yaw3=-.58,targetYaw3=-.58;
      const grass=new THREE.MeshLambertMaterial({color:0x63b852}),dirt=new THREE.MeshLambertMaterial({color:0x8b623b}),stone=new THREE.MeshLambertMaterial({color:0x68716b}),lava=new THREE.MeshStandardMaterial({color:0xed6432,emissive:0xb82f10,emissiveIntensity:.65});
      function box(w,h,d,m){const x=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);x.castShadow=x.receiveShadow=true;return x}
