<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Python Craft Lab</title>
  <meta name="description" content="A 2.5D block-world Python coding adventure for young builders." />
  <link rel="stylesheet" href="craft-v2.css" />
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="brandAvatar" aria-hidden="true"><span class="cap"></span><span class="face"></span></div>
    <span class="brandName">Python <b>Craft Lab</b></span>
    <small>Explore · Code · Build</small>
  </div>
  <div class="topTitle"><b>Python Adventure</b><span>Block World</span></div>
  <div class="dots" id="dots" aria-label="Level progress"></div>
</header>

<main>
  <section class="left">
    <div class="worldPanel">
      <div class="worldTitle"><span>CRAFT WORLD</span></div>
      <div class="frame">
        <div class="skyBits" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="wrap">
          <div class="world" id="world"></div>
          <div class="goalLabel"><span class="miniCrystal"></span><div><b>Goal: reach the crystal</b><small id="goalSub">Follow the path!</small></div></div>
          <div class="goal" id="goal"><div class="crystal"><i></i></div></div>
          <div class="player" id="player" data-dir="east">
            <div class="avatar" id="avatar">
              <span class="shadow"></span>
              <span class="backpack"></span>
              <span class="leg legL"></span><span class="leg legR"></span>
              <span class="torso"></span>
              <span class="arm armL"></span><span class="arm armR"></span>
              <span class="head"></span><span class="hair"></span><span class="eyes"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="run" id="run">▶ RUN CODE</button>
      <div class="hintCard"><span class="compass">✦</span><div class="hint" id="hint"></div></div>
    </div>
  </section>

  <section class="right">
    <div class="mission">
      <div class="mentor" aria-hidden="true"><span class="goggles"></span><span class="mface"></span><span class="mbody"></span></div>
      <div class="missionCopy"><div class="missionLabel">MISSION</div><h1 id="missionStep"></h1><p id="missionText"></p></div>
      <div class="missionTip"><span>💡</span><div id="missionTip">Use the game commands to change the world.</div></div>
    </div>

    <div class="codeCard">
      <div class="bar"><span class="pythonDot">●</span><span class="file">adventure.py</span><span class="spacer"></span><button class="reset" id="reset">↻ Reset</button></div>
      <div class="editorWrap"><div class="gutter" id="gutter"></div><textarea class="editor" id="editor" spellcheck="false" aria-label="Python editor"></textarea></div>
      <div class="toolbox">
        <div class="toolboxTop"><div><b>PYTHON CRAFT LAB COMMANDS</b><small>These game functions are provided for you.</small></div><span class="apiTag">GAME API</span></div>
        <div class="commandRow" id="commandRow"></div>
      </div>
    </div>

    <div class="feedback">
      <div class="statusIcon" id="statusIcon">✓</div>
      <div class="copy"><div class="ft" id="ft"></div><div class="fm" id="fm"></div></div>
      <div class="rewardCube" aria-hidden="true"></div>
      <button class="next" id="next">Next level →</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<script src="craft-v2.js"></script>
</body>
</html>
