<script>
const LESSONS=[
{n:1,name:'Make a Character Talk',title:'Say hello with Python',concept:'print()',mission:'Make Alex say something.',text:'Write a real Python <code>print()</code> statement and run it.',goal:'1+ spoken line',starter:'# Type your first line of Python below\nprint("Hello!")\n',example:'print("Hello Alex!")\nprint("Python can talk!")',learnTitle:'What does print() do?',learn:'print() sends output from your program. Here, each printed line becomes dialogue.',syntax:'print("Hello!")',tips:[['1','Text goes in quotes'],['2','Parentheses matter'],['3','Each print = one line']],stage:'talk'},
{n:2,name:'Variables Become Things',title:'Give your story memory',concept:'variables',mission:'Create a name and some coins.',text:'Store values in <code>name</code> and <code>coins</code>. Watch them appear in the world.',goal:'name + coins',starter:'# Variables remember values\nname = "Alex"\ncoins = 3\n\nprint(name)\nprint(coins)\n',example:'name = "Mia"\ncoins = 5\nprint(name)\nprint(coins)',learnTitle:'A variable is a named box',learn:'The name points to a value. Change the value, run again, and the world changes.',syntax:'coins = 3',tips:[['1','= means store'],['2','Text uses quotes'],['3','Numbers do not']],stage:'variables'},
{n:3,name:'Numbers Change the World',title:'Build a score machine',concept:'math',mission:'Increase the score with Python.',text:'Use variables and arithmetic to change <code>score</code>.',goal:'score ≥ 20',starter:'score = 10\nscore = score + 15\nprint(score)\n',example:'score = 12\nscore = score * 3\nprint(score)',learnTitle:'Python can calculate',learn:'The right side is calculated first, then the new value is stored back into the variable.',syntax:'score = score + 5',tips:[['1','+ adds'],['2','* multiplies'],['3','Run to update']],stage:'math'},
{n:4,name:'Make a Decision',title:'Open the decision gate',concept:'if / else',mission:'Decide whether the gate opens.',text:'Use <code>if</code> and <code>else</code> to set <code>result</code>.',goal:'result = OPEN',starter:'score = 85\n\nif score >= 70:\n    result = "OPEN"\nelse:\n    result = "LOCKED"\n\nprint(result)\n',example:'score = 72\nif score >= 70:\n    result = "OPEN"\nelse:\n    result = "LOCKED"\nprint(result)',learnTitle:'Conditions create branches',learn:'Python checks a condition. Only the matching indented block runs.',syntax:'if score >= 70:',tips:[['1',': ends the condition'],['2','Indent the block'],['3','else = otherwise']],stage:'decision'},
{n:5,name:'Repeat with a For Loop',title:'Make Alex jump four times',concept:'for / range()',mission:'Repeat one action several times.',text:'Use a real <code>for</code> loop. Print <code>"jump"</code> inside the loop.',goal:'3+ repeats',starter:'for i in range(4):\n    print("jump")\n',example:'for i in range(5):\n    print("jump")',learnTitle:'Loops remove repetition',learn:'range(4) makes the indented code run four times. The loop variable i changes each time.',syntax:'for i in range(4):',tips:[['1','range controls count'],['2','Indent loop body'],['3','i tracks repeats']],stage:'loop'},
{n:6,name:'Create Your Own Function',title:'Invent a cheer skill',concept:'def',mission:'Define and call your own function.',text:'Create <code>cheer(name)</code>, then call it. You are making your own reusable command.',goal:'define + call',starter:'def cheer(name):\n    print("Go " + name + "!")\n    print("You can do it!")\n\ncheer("Mia")\n',example:'def cheer(name):\n    print("Go " + name + "!")\n    print("Amazing work!")\n\ncheer("Leo")',learnTitle:'Functions package an idea',learn:'def creates a reusable piece of logic. Parameters let the same function work with different data.',syntax:'def cheer(name):',tips:[['1','def creates'],['2','name is input'],['3','Call it later']],stage:'function'},
{n:7,name:'Lists Build a Cast',title:'Create a group of friends',concept:'lists',mission:'Store several names in one list.',text:'Loop through a list and greet each friend.',goal:'3+ friends',starter:'friends = ["Mia", "Leo", "Ava"]\n\nfor friend in friends:\n    print("Hello " + friend)\n',example:'friends = ["Ryan", "Mason", "Spenser"]\nfor friend in friends:\n    print("Welcome " + friend)',learnTitle:'Lists store many values',learn:'A list keeps values in order. A for loop can visit each item one at a time.',syntax:'friends = ["Mia", "Leo"]',tips:[['1','[] makes a list'],['2',', separates items'],['3','Loop through items']],stage:'list'},
{n:8,name:'Final Story Challenge',title:'Code your own mini story',concept:'combine',mission:'Use at least three Python ideas together.',text:'Mix variables, a condition, a loop, a function, or a list to create a tiny animated story.',goal:'5+ story beats',starter:'hero = "Alex"\nenergy = 3\n\nprint("My name is " + hero)\n\nif energy > 0:\n    print("Adventure starts!")\n\nfor i in range(3):\n    print("Step " + str(i + 1))\n',example:'hero = "Mia"\nprint("Meet " + hero)\nfor i in range(3):\n    print("Clap " + str(i + 1))\nprint("The end!")',learnTitle:'Programs combine small ideas',learn:'Real programs are combinations of variables, decisions, loops and functions. This is your first mini project.',syntax:'Build your own!',tips:[['1','Plan the story'],['2','Use 3+ concepts'],['3','Make it yours']],stage:'final'}
];

function gutter(){let n=Math.max(11,ed.value.split('\n').length+3);$('gutter').textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}
function fb(type,title,text){$('feedback').className='feedback'+(type==='error'?' error':type==='try'?' try':'');$('feedbackIcon').textContent={ready:'▶',run:'…',ok:'✓',error:'!',try:'?'}[type]||'▶';$('feedbackTitle').textContent=title;$('feedbackText').textContent=text}
function renderBase(){$('lessonNo').textContent='LESSON '+C.n;$('lessonName').textContent=C.name;$('stageTitle').textContent=C.title;$('concept').textContent=C.concept;$('num').textContent=C.n;$('missionTitle').textContent=C.mission;$('missionText').innerHTML=C.text;$('goal').textContent=C.goal;$('learnTitle').textContent=C.learnTitle;$('learnText').textContent=C.learn;$('syntax').textContent=C.syntax;ed.value=C.starter;gutter();$('tips').innerHTML=C.tips.map(t=>`<div class="tip"><i>${t[0]}</i><div><b>${t[1]}</b><small>Real Python</small></div></div>`).join('');speech.textContent='Run your Python and watch what happens!';visual.innerHTML='';strip.innerHTML='';$('next').disabled=true;dots();fb('ready','Python is ready.','Write or change the code, then press Run Python.')}
const wait=ms=>new Promise(r=>setTimeout(r,ms));function pulse(cls){actor.classList.remove(cls);void actor.offsetWidth;actor.classList.add(cls);setTimeout(()=>actor.classList.remove(cls),600)}
function cards(lines){strip.innerHTML='';lines.forEach((line,i)=>{let x=document.createElement('div');x.className='chip';x.textContent=`${i+1}. ${line||'(blank)'}`;strip.appendChild(x)})}
async function talk(lines){cards(lines);actor.classList.add('talking');for(let i=0;i<lines.length;i++){[...strip.children].forEach((x,j)=>x.className='chip'+(j<i?' done':j===i?' active':''));speech.classList.remove('pop');void speech.offsetWidth;speech.textContent=lines[i]||'…';speech.classList.add('pop');if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lines[i]);u.rate=.96;u.volume=.45;speechSynthesis.speak(u)}await wait(Math.max(650,Math.min(1600,450+lines[i].length*30)))}actor.classList.remove('talking');[...strip.children].forEach(x=>x.className='chip done')}
function showVariables(env){visual.innerHTML=`<div class="nameBadge"><small>name</small><b>${escapeHtml(env.name??'???')}</b></div><div class="coins" id="coins"></div>`;let n=Math.max(0,Math.min(12,Number(env.coins)||0)),box=$('coins');for(let i=0;i<n;i++){let c=document.createElement('div');c.className='coin';c.textContent='$';setTimeout(()=>box.appendChild(c),i*90)}}
function showMath(env){let score=Number(env.score)||0,p=Math.max(0,Math.min(100,score));visual.innerHTML=`<div class="scoreBox"><small>SCORE</small><br><b>${score}</b><div class="meter"><i id="meterFill"></i></div></div>`;requestAnimationFrame(()=>requestAnimationFrame(()=>$('meterFill').style.width=p+'%'))}
function showDecision(env,lines){let result=String(env.result??lines.at(-1)??'LOCKED').toUpperCase();visual.innerHTML=`<div class="gateLabel">${escapeHtml(result)}</div><div class="door ${result==='OPEN'?'open':''}"></div>`;speech.textContent=result==='OPEN'?'The gate opens!':'The gate stays locked.'}
async function showLoop(lines){cards(lines);let count=0;for(let i=0;i<lines.length;i++){if(lines[i].toLowerCase().includes('jump')){pulse('jump');count++;speech.textContent=`Jump ${count}!`;await wait(520)}[...strip.children].forEach((x,j)=>x.className='chip'+(j<=i?' done':''))}}
function showList(env){let arr=Array.isArray(env.friends)?env.friends:[];visual.innerHTML=`<div class="friendRow">${arr.slice(0,5).map(n=>`<div class="friend"><i></i><b>${escapeHtml(String(n))}</b></div>`).join('')}</div>`}
async function showFinal(lines){visual.innerHTML='<div class="storyTimeline" id="timeline"></div>';let tl=$('timeline');lines.slice(0,6).forEach((x,i)=>tl.insertAdjacentHTML('beforeend',`<div class="storyBeat">${i+1}. ${escapeHtml(x)}</div>`));for(let i=0;i<Math.min(lines.length,6);i++){[...tl.children].forEach((x,j)=>x.className='storyBeat'+(j===i?' active':''));speech.textContent=lines[i];pulse(i%2?'cheer':'jump');await wait(650)}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function valid(lines,env,code){switch(C.stage){case'talk':return lines.length>=1;case'variables':return typeof env.name==='string'&&Number.isFinite(Number(env.coins));case'math':return Number(env.score)>=20;case'decision':return String(env.result||'').toUpperCase()==='OPEN';case'loop':return lines.filter(x=>x.toLowerCase().includes('jump')).length>=3;case'function':return code.includes('def ')&&lines.length>=2;case'list':return Array.isArray(env.friends)&&env.friends.length>=3&&lines.length>=3;case'final':return lines.length>=5;default:return true}}
async function visualize(lines,env){visual.innerHTML='';if(C.stage==='talk'||C.stage==='function')await talk(lines);else if(C.stage==='variables'){showVariables(env);await talk(lines)}else if(C.stage==='math'){showMath(env);await talk(lines)}else if(C.stage==='decision'){showDecision(env,lines);cards(lines)}else if(C.stage==='loop')await showLoop(lines);else if(C.stage==='list'){showList(env);await talk(lines)}else if(C.stage==='final')await showFinal(lines)}
const RUNNER=`import json, io, contextlib\n_env = {}\n_buffer = io.StringIO()\ntry:\n    with contextlib.redirect_stdout(_buffer):\n        exec(user_code, _env, _env)\n    _safe = {}\n    for _k, _v in _env.items():\n        if not _k.startswith("__"):\n            try:\n                json.dumps(_v)\n                _safe[_k] = _v\n            except Exception:\n                pass\n    _result = json.dumps({"ok": True, "lines": _buffer.getvalue().splitlines(), "env": _safe})\nexcept Exception as _e:\n    _result = json.dumps({"ok": False, "error": f"{type(_e).__name__}: {_e}"})\n_result`;
async function run(){if(busy)return;if(!py){fb('try','Python is still loading.','Try again in a moment.');return}busy=true;$('run').disabled=true;$('next').disabled=true;fb('run','Running real Python…','Watch the visual world respond.');if('speechSynthesis'in window)speechSynthesis.cancel();try{py.globals.set('user_code',ed.value);let raw=await py.runPythonAsync(RUNNER);let r=JSON.parse(String(raw));if(!r.ok){speech.textContent='Python found a bug.';fb('error','Python found a bug.',r.error);return}let lines=(r.lines||[]).map(String),env=r.env||{};await visualize(lines,env);if(valid(lines,env,ed.value)){localStorage.setItem('pcl-complete-'+C.n,'1');dots();fb('ok','Lesson complete!','You used real Python and changed the visual world.');$('next').disabled=false}else fb('try','Almost there.','Change the code so you hit the lesson goal, then run it again.')}catch(e){fb('error','Could not run Python.',String(e.message||e));speech.textContent='Something went wrong.'}finally{busy=false;$('run').disabled=false}}
async function init(){try{fb('run','Loading real Python…','The first load can take a few seconds.');py=await loadPyodide();fb('ready','Python is ready.','Write or change the code, then press Run Python.')}catch(e){fb('error','Python could not load.','Refresh the page and try again.')}}
$('run').onclick=run;$('reset').onclick=renderBase;$('example').onclick=()=>{ed.value=C.example;gutter();ed.focus()};$('next').onclick=()=>{if(C.n<8)location.href='lesson.html?lesson='+(C.n+1);else location.href='index.html'};ed.oninput=gutter;renderBase();init();
</script>
</body>
